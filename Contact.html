<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact - Long's Electrical Services</title>

<link href="gallery/transitions.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet"/>

<style>
body {
  background: url(contact/stairs.jpeg) no-repeat center fixed;
  background-size: cover;
  font-family: 'Metal Mania', cursive;
}

.small {
  font-size:20px;
}

h1, h2, label {
  color:gold;
  text-shadow:2px 2px 5px black;
  font-family:'Metal Mania', cursive;
}

.bg-div {
  background:black;
  opacity:0.6;
  overflow:hidden;
}

.logo-img {
  float:left;
  margin:1px;
}

nav {
  float:right;
}

nav ul {
  list-style:none;
  padding:0;
  margin:0;
}

nav li {
  display:inline-block;
}

nav a {
  color:gold;
  font-family:'Metal Mania', cursive;
  text-decoration:none;
  padding:.5em 1em;
  display:inline-block;
}

nav a:hover,
.active {
  background-color:#52595D;
  transform:scale(1.1);
}

form {
  background-color:rgba(0,0,0,.6);
  color:gold;
  padding:2rem;
  max-width:600px;
  margin:auto;
  border-radius:10px;
  font-family:'Metal Mania', cursive;
}

input, select, textarea {
  width:100%;
  padding:10px;
  margin:8px 0 16px;
  font-family:inherit;
  font-size:16px;
  border-radius:5px;
  border:1px solid #ccc;
}

.submit-button {
  background-color:gold;
  color:black;
  font-family:'Metal Mania', cursive;
  font-size:18px;
  padding:10px 30px;
  border:none;
  cursor:pointer;
  clip-path:polygon(10% 0%,90% 0%,70% 40%,100% 50%,20% 100%,30% 60%,0% 50%);
  filter:drop-shadow(2px 2px 6px rgba(0,0,0,.6));
}

.form-section.hidden {
  display:none;
}

.footer-text,
.ft-div {
  flex-shrink:0;
  text-align:center;
  padding:10px 0;
  font-family:Metal Mania;
}

.footer-text {
  background:transparent;
  text-shadow:5px 5px 8px black;
}

.ft-div {
  background:black;
  color:gold;
  opacity:.6;
  padding:20px;
  text-shadow:2px 2px 5px black;
}

footer {
  text-align:center;
  font-size:14px;
  font-family:Metal Mania;
}
</style>
</head>

<body>

<div class="bg-div">

<img alt="Logo" class="logo-img" src="contact/logo.png" style="width:145px;height:80px;"/>

<nav>
<ul>
<li><a href="/index.html">Home</a></li>
<li><a href="/Services.html">Services</a></li>
<li><a href="/About.html">About</a></li>
<li><a class="active" href="#">Contact</a></li>
<li><a href="/Gallery.html">Gallery</a></li>
</ul>
</nav>

</div>


<h1 style="text-align:center;margin-top:100px;">
Let us know how we can help!
</h1>

<h2 style="text-align:center;">
Fill out the form below and we'll get back to you as soon as possible.
</h2>


<!-- Google Forms hidden submission target -->
<iframe name="hidden_iframe" style="display:none;"></iframe>


<form 
action="https://docs.google.com/forms/d/e/1FAIpQLSelnbQcXuovwEbQDtEDa7cdJg4yEuoygDtXDkhpi1sHrWW0ZQ/formResponse"
id="contactForm"
method="POST"
target="hidden_iframe">


<!-- Honeypot -->
<input name="_honey" style="display:none" type="text"/>


<label for="subject">Subject:</label>

<select id="subject" name="entry.1915679418" required>

<option value="">-- Select a Subject --</option>
<option value="Inspection Request">Inspection Request</option>
<option value="New Construction">New Construction</option>
<option value="Generators">Generators</option>
<option value="Other Inquiry">Other Inquiry</option>

</select>


<label for="name">Your Name:</label>
<input id="name" name="entry.2132430199" required type="text">


<label for="address">Address:</label>
<input id="address" name="entry.124024564" type="text">


<label for="phone">Phone Number:</label>
<input id="phone" name="entry.1992104112" type="text">


<label for="email">Your Email:</label>
<input id="email" name="entry.1402215697" type="email">


<!-- Inspection Section -->

<div class="form-section hidden" id="inspectSection">

<label for="issue">
Describe your issue:
</label>

<textarea id="issue" name="entry.1992104112" rows="4"></textarea>


<label for="aep">
AEP Work Order #:
</label>

<input id="aep" name="entry.1402215697" type="text">

</div>


<!-- New Construction Section -->

<div class="form-section hidden" id="newconSection">

<label for="prints">
Do you have blueprints?
</label>

<select id="prints" name="entry.862153166">

<option value="">--</option>
<option value="Yes">Yes</option>
<option value="No">No</option>

</select>


<label for="elec">
Is it all electric? Any gas? Please describe:
</label>
<textarea id="elec" name="entry.1652852172" rows="4"></textarea>

</div>


<!-- Generator Section -->

<div class="form-section hidden" id="genSection">

<label for="service">
Service Size:
</label>

<input id="service" name="entry.1940979031" type="text">


<label for="gas">
Gas or Propane On Site:
</label>

<select id="gas" name="entry.342561365">

<option value="">--</option>
<option value="Yes">Yes</option>
<option value="No">No</option>

</select>

</div>

<!-- Other Inquiry Section -->

<div class="form-section hidden" id="inquirySection">

<label for="inquiry">
Please describe your inquiry in detail:
</label>

<textarea id="inquiry" name="entry.1721853495" rows="4"></textarea>

</div>


<button class="submit-button" type="submit">
Submit
</button>


</form>


<script>

const subjectDropdown = document.getElementById("subject");

const sections = {
  inspection: document.getElementById("inspectSection"),
  newcon: document.getElementById("newconSection"),
  gen: document.getElementById("genSection"),
  inquiry: document.getElementById("inquirySection")
};


subjectDropdown.addEventListener("change", function(){

  Object.values(sections).forEach(section => {
    section.classList.add("hidden");
  });


  const sectionMap = {

    "Inspection Request": "inspection",

    "New Construction": "newcon",

    "Generators": "gen",

    "Other Inquiry": "inquiry"

  };


  if(sectionMap[this.value]) {

    sections[sectionMap[this.value]]
      .classList.remove("hidden");

  }

});



document.getElementById("contactForm")
.addEventListener("submit", function(){

setTimeout(function(){

window.location.href = "thankyou.html";

},2500);


});


</script>



<br/>
<br/>


<div class="ft-div">

<footer>

</footer>

</div>


</body>
</html>

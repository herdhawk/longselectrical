.submit-button:disabled {

*/

.form-message {

<script>

/* =========================================================
   LONG'S ELECTRICAL SERVICES
   CONTACT FORM CONTROLS + CLIENT-SIDE SPAM PROTECTION
   ========================================================= */


const form =
  document.getElementById(
    "contactForm"
  );


const subjectDropdown =
  document.getElementById(
    "subject"
  );


const submitButton =
  document.getElementById(
    "submitButton"
  );


const formMessage =
  document.getElementById(
    "formMessage"
  );


const hiddenIframe =
  document.getElementById(
    "hidden_iframe"
  );


/*
  Track how long the visitor has
  had the form open.
*/

const formLoadTime =
  Date.now();


let formSubmitted =
  false;



/* =========================================================
   CONDITIONAL SECTIONS
   ========================================================= */


const sections = {

  "Inspection Request":
    document.getElementById(
      "inspectSection"
    ),

  "New Construction":
    document.getElementById(
      "newconSection"
    ),

  "Generators":
    document.getElementById(
      "genSection"
    ),

  "Other Inquiry":
    document.getElementById(
      "inquirySection"
    )

};



function disableSection(section) {

  section.classList.add(
    "hidden"
  );


  const controls =
    section.querySelectorAll(
      "input, select, textarea"
    );


  controls.forEach(
    function(control) {

      control.disabled = true;

    }
  );

}



function enableSection(section) {

  section.classList.remove(
    "hidden"
  );


  const controls =
    section.querySelectorAll(
      "input, select, textarea"
    );


  controls.forEach(
    function(control) {

      control.disabled = false;

    }
  );

}



function updateSections() {

  Object.values(
    sections
  ).forEach(
    disableSection
  );


  const selected =
    sections[
      subjectDropdown.value
    ];


  if (selected) {

    enableSection(
      selected
    );

  }

}



subjectDropdown.addEventListener(
  "change",
  updateSections
);



/*
  Ensure everything starts in
  the correct disabled state.
*/

updateSections();



/* =========================================================
   HELPERS
   ========================================================= */


function showMessage(message) {

  formMessage.textContent =
    message;

  formMessage.style.display =
    "block";

}



function clearMessage() {

  formMessage.textContent =
    "";

  formMessage.style.display =
    "none";

}



function validUSPhone(phone) {

  if (
    phone.trim() === ""
  ) {

    return true;

  }


  const digits =
    phone.replace(
      /\D/g,
      ""
    );


  if (
    digits.length === 10
  ) {

    return true;

  }


  if (
    digits.length === 11 &&
    digits.startsWith("1")
  ) {

    return true;

  }


  return false;

}



function suspiciousRepeatedText() {

  const selectedSubject =
    subjectDropdown.value;


  let fields = [];


  if (
    selectedSubject ===
    "Inspection Request"
  ) {

    fields = [
      document
        .getElementById("issue")
        .value
    ];

  }


  else if (
    selectedSubject ===
    "New Construction"
  ) {

    fields = [
      document
        .getElementById("elec")
        .value
    ];

  }


  else if (
    selectedSubject ===
    "Other Inquiry"
  ) {

    fields = [
      document
        .getElementById("inquiry")
        .value
    ];

  }


  /*
    Currently each branch only has
    one long-description field, so
    legitimate customers won't get
    accidentally blocked.

    The Apps Script remains the
    server-side spam filter.
  */

  return false;

}



/* =========================================================
   FORM SUBMISSION
   ========================================================= */


form.addEventListener(
  "submit",
  function(event) {


    clearMessage();



    /* -----------------------------------------
       HONEYPOT
       ----------------------------------------- */

    const honeypot =
      document
        .getElementById(
          "website"
        )
        .value
        .trim();


    if (
      honeypot !== ""
    ) {

      event.preventDefault();

      /*
        Don't tell the bot exactly
        why it was rejected.
      */

      showMessage(
        "Unable to submit the form. Please try again."
      );

      return false;

    }



    /* -----------------------------------------
       MINIMUM COMPLETION TIME
       ----------------------------------------- */

    const elapsed =
      Date.now() -
      formLoadTime;


    if (
      elapsed < 4000
    ) {

      event.preventDefault();

      showMessage(
        "Please wait a few seconds before submitting the form."
      );

      return false;

    }



    /* -----------------------------------------
       NAME
       ----------------------------------------- */

    const name =
      document
        .getElementById(
          "name"
        )
        .value
        .trim();


    if (
      name.length < 2
    ) {

      event.preventDefault();

      showMessage(
        "Please enter your name."
      );

      return false;

    }



    /* -----------------------------------------
       PHONE
       ----------------------------------------- */

    const phone =
      document
        .getElementById(
          "phone"
        )
        .value;


    if (
      !validUSPhone(phone)
    ) {

      event.preventDefault();

      showMessage(
        "Please enter a valid 10-digit phone number."
      );

      return false;

    }



    /* -----------------------------------------
       EMAIL
       ----------------------------------------- */

    const email =
      document
        .getElementById(
          "email"
        );


    if (
      !email.checkValidity()
    ) {

      event.preventDefault();

      showMessage(
        "Please enter a valid email address."
      );

      return false;

    }



    /* -----------------------------------------
       SUBJECT
       ----------------------------------------- */

    if (
      subjectDropdown.value === ""
    ) {

      event.preventDefault();

      showMessage(
        "Please select a subject."
      );

      return false;

    }

const jobState =
  document.getElementById("jobState").value;

const serviceStates = [
  "WV",
  "OH",
  "KY"
];

if (!serviceStates.includes(jobState)) {

  event.preventDefault();

  showMessage(
    "We're sorry, Long's Electrical Services currently only performs work in West Virginia, Ohio, and Kentucky. You will now be redirected."
  );

  setTimeout(function() {
    window.location.href = "https://www.google.com/";
  }, 3000);

  return false;
}

    /* -----------------------------------------
       FINAL SUBMISSION
       ----------------------------------------- */

    formSubmitted =
      true;


    submitButton.disabled =
      true;


    submitButton.textContent =
      "Sending...";


    /*
      At this point we allow the
      browser to POST normally to
      Google Forms.
    */

  }
);



/* =========================================================
   GOOGLE RESPONSE COMPLETE
   ========================================================= */


/*
  When Google finishes loading its
  response into the hidden iframe,
  send the visitor to thankyou.html.

  The formSubmitted flag prevents
  the iframe's initial load from
  causing a redirect.
*/


hiddenIframe.addEventListener(
  "load",
  function() {

    if (
      formSubmitted
    ) {

      setTimeout(
        function() {

          window.location.href =
            "thankyou.html";

        },

        350

      );

    }

  }
);


</script>
